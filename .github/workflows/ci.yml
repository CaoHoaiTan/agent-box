name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: ShellCheck and Hadolint
        run: make lint
      - name: Generic secret scan
        run: make leaks
      - name: Validate Compose with and without optional services
        run: |
          docker compose config --quiet
          docker compose --profile services config --quiet

  build:
    needs: lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: agent-box:ci
          cache-from: type=gha,scope=agentbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agentbox-${{ matrix.arch }}
      - name: Prepare container-writable CI workspace
        if: matrix.arch == 'amd64'
        run: sudo chown -R 1000:1000 workspaces/personal
      - name: Firewall and isolation smoke test
        if: matrix.arch == 'amd64'
        run: scripts/ci-smoke.sh agent-box:ci
